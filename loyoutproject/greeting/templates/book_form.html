<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ action }} Book</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      label { display:block; margin-top: .6rem; }
      input[type="text"], input[type="number"] { width: 300px; padding: .4rem; }
    </style>
</head>
<body>
    <h1>{{ action }} Book</h1>
    <form method="post">{% csrf_token %}
        {{ form.non_field_errors }}
        <div>
            <label>Title</label>
            {{ form.title }}
            {{ form.title.errors }}
        </div>
        <div>
            <label>Author</label>
            {{ form.author }}
            {{ form.author.errors }}
        </div>
        <div>
            <label>Year</label>
            {{ form.year }}
            {{ form.year.errors }}
        </div>
        <div style="margin-top:1rem;">
            <button type="submit">{{ action }} Book</button>
            <a href="{% url 'home' %}">Cancel</a>
        </div>
    </form>
</body>
</html>
